server.port=8081

# Spring Application Name
spring.application.name=familytree-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kmk-family?ApplicationName=familytree-backend
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload & Media Storage
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/photos

# Jackson Serialization / Deserialization
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Admin site: one shared password (set ADMIN_PASSWORD in the environment, never in this file).
# Without it, the admin site and every change to the family stay locked.
app.admin.password=${ADMIN_PASSWORD:}
app.admin.session-days=30

# Family website: one shared password for everyone. The admin sets and changes it in the admin site
# (Share the link -> Family website password). FAMILY_PASSWORD in the environment (never in this file)
# is only a starting password until then. With neither, the family website is open to anyone with the link.
app.family.password=${FAMILY_PASSWORD:}
app.family.session-days=180
