<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMK Family • Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#1E4636" />
    <!-- Family Album look with Plus Jakarta Sans & Noto Sans Tamil fonts -->
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('fatal-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#d32f2f;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        el.textContent += '\n[Script Error]: ' + (e.error ? (e.error.stack || e.error.message) : e.message) + '\n';
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('fatal-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#d32f2f;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        el.textContent += '\n[Unhandled Promise Rejection]: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Unknown rejection') + '\n';
      });
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" />
    <script>
      document.documentElement.setAttribute('data-theme', 'album');
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
